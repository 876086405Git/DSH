# A PR runs what it touches; a push to main runs everything, which also catches
# whatever the path filters below miss. `CI OK` is the one result to look at.
# External PRs are closed by pr-gate.yml and spend no runner here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
      startup_policy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.startup_policy == 'true' }}
      packages: ${{ github.event_name != 'pull_request' || steps.filter.outputs.packages == 'true' }}
      runtime: ${{ github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true' || steps.filter.outputs.memory == 'true' }}
      memory: ${{ github.event_name != 'pull_request' || steps.filter.outputs.memory == 'true' }}
      ios_runtime: ${{ steps.filter.outputs.ios_runtime }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # The paths outside each area's own are files its tests read.
          filters: |
            ci: &ci .github/workflows/ci.yml
            app: [*ci, 'app/**', 'tooling/companion/**', 'packages/**', 'sdk/plugin-kit/**', 'runtime/tests/direct/**', 'site/share/**', 'docs/guide/**', 'THIRD_PARTY_NOTICES.md', 'tooling/fixtures/diagnostic-redaction.json']
            startup_policy: [*ci, 'app/android/**', 'runtime/tests/direct/**', '**/.gitattributes']
            packages: [*ci, 'packages/**']
            runtime: [*ci, 'runtime/**', 'app/assets/islands/island.js', 'app/test/plugins/islands/support/island_page_harness.mjs', 'app/assets/engine/auth/**', 'packages/dsh_client/test/fixtures/companion_signal_results.json', 'app/ohos/entry/src/main/ets/runtime/**', 'app/ohos/entry/src/main/ets/entryability/EntryAbility.ets', 'app/ohos/entry/src/main/ets/phone/PhoneBridge.ets', 'tooling/ohos/**', 'examples/**', 'sdk/plugin-kit/**', 'app/tool/engine_auth/**', 'app/test/plugin_config/fixtures/**', 'app/test/media/fixtures/**', 'app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/runtime/SafeMode.kt', 'app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/PhoneGuest.kt']
            memory: [*ci, 'tooling/companion/**', 'tooling/test_companion_memory_replay.py', 'packages/dsh_client/lib/**', 'packages/dsh_client/pubspec.*', 'packages/dsh_client/test/companion*.dart', 'packages/dsh_client/test/support/**', 'packages/dsh_client/tool/companion_memory_replay_test.dart', 'app/lib/companion/**', 'app/lib/ui/companion/**', 'app/lib/l10n/parts/companion_*.arb', 'app/pubspec.*', 'app/test/companion/**', 'app/test/support/**', 'app/test/flutter_test_config.dart', 'app/tool/companion_memory_replay_test.dart', 'runtime/bridge/dsh-go-bridge/lib/companion/**', 'runtime/tests/companion*.test.mjs', 'runtime/tests/fixtures/companion*.mjs', 'runtime/patches/companion*.diff', 'runtime/locks/**', 'runtime/lib/rtbuild.py']
            ios_runtime:
              - *ci
              - '.github/workflows/ios-compile.yml'
              - 'runtime/**'
              - 'tooling/ios/**'
              - 'app/ohos/entry/src/main/cpp/**'
              - 'app/ohos/entry/src/main/ets/runtime/RuntimeCore.ets'
              - 'app/ios/**'
              - 'app/integration_test/ios_engine_check.dart'
              - 'packages/dsh_client/**'

  ios-runtime:
    name: iOS runtime regression
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios_runtime == 'true'
    uses: ./.github/workflows/ios-compile.yml
    with:
      regression_only: true

  checks:
    name: Generated files, tooling, SDK, web
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generated files are in sync
        run: |
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
          node sdk/plugin-kit/scripts/sync-skill.mjs --check
          # Not --check: this also writes site/build/share, which the share worker builds from.
          python3 app/tool/make_replay_viewer.py
          git diff --exit-code -- app/lib/share_code/replay_viewer.g.dart
      - name: Python tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q Pillow==13.0.0 numpy==2.4.0
          for dir in tooling runtime/tests app/tool; do
            "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s "$dir" -p 'test_*.py'
          done
      - name: OHOS gate runner contract
        run: python3 tooling/ohos/tests/run-gates.test.py
      - name: Plugin SDK
        working-directory: sdk/plugin-kit
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test
      - name: Market, sites, share worker
        run: |
          (cd market && npm ci --ignore-scripts --no-audit --no-fund && npm test)
          (cd site/home && npm run check && npm run check:content && npm test)
          (cd services/share-worker && npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm run typecheck && npm test)
          node --test site/share/test/viewer_test.mjs

  # A job of its own: on a test shard its minute was the difference between that shard and the others.
  analyze:
    name: Flutter analyze
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - *checkout
      - *node
      - &flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze, and generated localization matches its source
        run: |
          flutter analyze --no-pub
          python3 tool/l10n_merge.py
          git diff --exit-code -- lib/l10n
      # Her stage's own contracts: render budget, the float window (stage.js run against
      # fake device boundaries), and the model replay, whose adapt checker runs on this job's Dart.
      - name: Companion stage contracts
        working-directory: .
        run: node --test tooling/companion/*.test.mjs app/test/companion/*.test.cjs

  flutter:
    name: Flutter ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
      NOTO_CJK_VERSION: 1:20230817+repack1-3
      NOTO_EMOJI_VERSION: v2.051
    defaults:
      run:
        working-directory: app
    steps:
      - *checkout
      - *node
      - *flutter
      # The goldens have Noto Color Emoji 2.051; Ubuntu's 2.047 draws the glyphs differently.
      # Only the files the tests read, cached: the 206 MB of packages sometimes take apt's
      # mirror longer than the job's whole timeout. Saved right after the download, so a
      # job that fails or times out later doesn't lose it.
      - &restore-fonts
        name: Restore the fonts the goldens were drawn with
        id: fonts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: test-fonts-${{ env.NOTO_CJK_VERSION }}-${{ env.NOTO_EMOJI_VERSION }}
      - &download-fonts
        name: Download the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $HOME/test-fonts/NotoColorEmoji.ttf" | sha256sum -c -
      - &save-fonts
        name: Save the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: ${{ steps.fonts.outputs.cache-primary-key }}
      - &install-fonts
        name: Install the fonts
        run: |
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      # fish and zsh for test/remote/ssh_start_completion_test.dart, cached like the fonts and
      # for the same reason. The packages are whatever this runner image lacks, so the image
      # version is in the key.
      - name: Name the runner image
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore the account shells for SSH bootstrap tests
        id: shells
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-shells
          key: test-shells-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}
      - name: Download the shells
        if: steps.shells.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends --download-only fish zsh
          mkdir -p ~/test-shells
          echo "$ImageVersion" > ~/test-shells/image
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/test-shells/ \;
      - name: Save the shells
        if: steps.shells.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-shells
          key: ${{ steps.shells.outputs.cache-primary-key }}
      - name: Install the shells
        run: |
          debs=(~/test-shells/*.deb)
          [ ! -e "${debs[0]}" ] || sudo dpkg -i "${debs[@]}"
          fish --version && zsh --version
      - run: flutter pub get --enforce-lockfile
      # `flutter test` compiles each test file by itself and starts a process for it; with 1300
      # files that was four fifths of a shard. A pull request runs them as bundles
      # (tool/bundle_tests.py): one compile and one process for a directory's files. A file
      # that fails in its bundle is run again by itself, and that result is the one that counts.
      - name: Test this shard's bundles
        if: github.event_name == 'pull_request'
        run: |
          python3 tool/bundle_tests.py --shard ${{ matrix.shard }}/3 > "$RUNNER_TEMP/targets.txt"
          flutter test --no-pub --concurrency=4 --reporter github --file-reporter "json:$RUNNER_TEMP/bundles.json" $(cat "$RUNNER_TEMP/targets.txt") && exit
          python3 tool/bundle_tests.py --failed "$RUNNER_TEMP/bundles.json" > "$RUNNER_TEMP/again.txt"
          echo "::group::Failed in a bundle, run again alone"
          cat "$RUNNER_TEMP/again.txt"
          echo "::endgroup::"
          find test -path '*/failures/*.png' -delete
          flutter test --no-pub --concurrency=4 --reporter github $(cat "$RUNNER_TEMP/again.txt")
          echo "::warning::These passed alone and failed in a bundle; list them in app/test/bundle_solo.txt: $(tr '\n' ' ' < "$RUNNER_TEMP/again.txt")"
      # main runs every file by itself, as a pull request did before the bundles: the result
      # the bundles are held to.
      # Split by file, not with --total-shards: that still compiles every file on every shard.
      - name: Test every third file
        if: github.event_name != 'pull_request'
        run: flutter test --no-pub --concurrency=4 --reporter github $(find test -name '*_test.dart' | sort | awk 'NR % 3 == ${{ matrix.shard }}')
      - name: Keep golden diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures-${{ matrix.shard }}
          path: app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

  dart:
    name: Dart packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn # The registry these two lockfiles were resolved from.
    steps:
      - *checkout
      - *flutter
      - name: Dependencies, and OpenSSH for the transport interoperability tests
        run: |
          for pkg in dsh_client dsh_remote dsh_tavern; do
            (cd "packages/$pkg" && dart pub get --enforce-lockfile)
          done
          (cd packages/dartssh2 && PUB_HOSTED_URL=https://pub.dev dart pub get)
          # The runner image has sshd; apt only if one day it does not (its mirror can stall for minutes).
          command -v sshd > /dev/null || { sudo apt-get update -q && sudo apt-get install -y --no-install-recommends openssh-server; }
          sudo mkdir -p /run/sshd
      # The packages share nothing and dsh_tavern alone is most of the time: side by side, each
      # with its own log, printed in order afterwards.
      - name: Analyze and test the four packages side by side
        run: |
          names=(dsh_client dsh_remote dsh_tavern dartssh2)
          pids=()
          for pkg in "${names[@]}"; do
            (
              cd "packages/$pkg"
              if [ "$pkg" = dartssh2 ]; then
                # SSH compression and OpenSSH interoperability.
                export SSH_COMPRESSION_TEST=1 PUB_HOSTED_URL=https://pub.dev
                dart analyze
                dart test
                dart test --platform chrome test/src/ssh_compression_web_test.dart
              else
                dart analyze
                dart test
              fi
            ) > "$RUNNER_TEMP/$pkg.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for i in "${!names[@]}"; do
            status=0
            wait "${pids[$i]}" || status=$?
            echo "::group::${names[$i]}: exit $status"
            cat "$RUNNER_TEMP/${names[$i]}.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::packages/${names[$i]} failed; its log is in the group above"
              failed=1
            fi
          done
          exit "$failed"

  runtime:
    name: Runtime and bridge
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_USE_IO_URING: 0
    steps:
      - *checkout
      - *node
      - name: Restore the patched DSH and pnpm prefixes
        id: runtime-prefixes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dsh
            ${{ runner.temp }}/pnpm
          key: runtime-prefixes-v1-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-${{ hashFiles('.github/workflows/ci.yml', 'runtime/locks/**/package*.json', 'runtime/patches/**', 'runtime/session-deletion/**', 'runtime/lib/rtbuild.py', 'runtime/build-runtime.sh') }}
      - name: Install a throwaway patched DSH
        if: steps.runtime-prefixes.outputs.cache-hit != 'true'
        run: |
          version=$(sed -nE 's/^DSH_VERSION="\$\{DSH_VERSION:-(.+)\}"$/\1/p' runtime/build-runtime.sh)
          prefix="$RUNNER_TEMP/dsh"
          mkdir "$prefix"
          cp "runtime/locks/dsh-$version/package.json" "runtime/locks/dsh-$version/package-lock.json" "$prefix/"
          npm ci --prefix "$prefix" --ignore-scripts --no-audit --no-fund
          cp "$prefix/node_modules/@deepseek-ai/dsh-fs-local/lib/index.js" "$prefix/fs-local-original.js"
          python3 -I runtime/lib/rtbuild.py patch-dsh --prefix "$prefix" --dsh-version "$version" --target android
          pnpm_version=$(sed -nE 's/^PNPM_VERSION="\$\{PNPM_VERSION:-(.+)\}"$/\1/p' runtime/build-runtime.sh)
          pnpm_prefix="$RUNNER_TEMP/pnpm"
          mkdir "$pnpm_prefix"
          cp "runtime/locks/pnpm-$pnpm_version/package.json" "runtime/locks/pnpm-$pnpm_version/package-lock.json" "$pnpm_prefix/"
          npm ci --prefix "$pnpm_prefix" --ignore-scripts --no-audit --no-fund
      # Save before tests: some tests deliberately modify their disposable prefix.
      - name: Save the prepared prefixes
        if: steps.runtime-prefixes.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dsh
            ${{ runner.temp }}/pnpm
          key: ${{ steps.runtime-prefixes.outputs.cache-primary-key }}
      - name: Install the locked bridge extraction dependency
        run: npm ci --prefix runtime/bridge/dsh-go-bridge --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Export the runtime test paths
        run: |
          prefix="$RUNNER_TEMP/dsh"
          pnpm_prefix="$RUNNER_TEMP/pnpm"
          companion_task_harness="$RUNNER_TEMP/companion-task-source"
          python3 -I runtime/tests/fixtures/prepare-companion-task-source.py \
            --node-modules "$prefix/node_modules" --target android --out "$companion_task_harness"
          {
            echo "DSH_PREFIX=$prefix"
            echo "DSH_TEST_PREFIX=$prefix"
            echo "COMPANION_TASK_HARNESS=$companion_task_harness"
            echo "PNPM_BIN=$pnpm_prefix/node_modules/pnpm/bin/pnpm.mjs"
            echo "DSH_INSTALL=$prefix/node_modules/@deepseek-ai/dsh"
            echo "DSH_TOOLS_DIR=$prefix/node_modules/@deepseek-ai/dsh-tools"
            echo "DSH_FS_LOCAL_ORIGINAL_JS=$prefix/fs-local-original.js"
          } >> "$GITHUB_ENV"
      - name: Unit tests
        run: |
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout --test-reporter-destination="$RUNNER_TEMP/companion-engine.xml" \
            runtime/tests/*.test.mjs app/tool/engine_auth/*.test.mjs
          node_headers="$(node -p 'require("node:path").resolve(require("node:path").dirname(process.execPath), "../include/node")')"
          test -f "$node_headers/node_api.h"
          c++ -std=c++17 -shared -fPIC -I "$node_headers" tooling/ohos/tests/runtime-zip-zlib.cc -lz -o "$RUNNER_TEMP/ohos-test-zlib.node"
          OHOS_TEST_ZLIB_ADDON="$RUNNER_TEMP/ohos-test-zlib.node" node --test tooling/ohos/tests/lifecycle-host.test.mjs tooling/ohos/tests/transient-task.test.mjs tooling/ohos/tests/runtime-channel.test.mjs
          python3 -I runtime/tests/test_patch_dsh.py
          python3 -I runtime/tests/test_bridge_dependencies.py
      - name: Keep actual engine replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-engine-replay
          path: ${{ runner.temp }}/companion-engine.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Media and example plugins
        run: |
          (cd runtime/media/dsh-media && npm install --ignore-scripts --no-package-lock --no-audit --no-fund && npm test)
          for plugin in examples/plugins/dsh-go-example-*/; do
            (cd "$plugin" && npm test && npm run check)
          done
      - name: Route guard and native bridge against a real host
        run: |
          bash runtime/tests/run-guard-tests.sh "$DSH_PREFIX"
          bash runtime/tests/run-native-tests.sh "$DSH_PREFIX"

  memory-replay:
    name: Companion memory offline replay
    needs: [changes, runtime]
    if: always() && needs.changes.outputs.memory == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
      NOTO_CJK_VERSION: 1:20230817+repack1-3
      NOTO_EMOJI_VERSION: v2.051
    steps:
      - *checkout
      - *flutter
      - *restore-fonts
      - *download-fonts
      - *save-fonts
      - *install-fonts
      # Package resolution, native hooks and localization generation are explicit
      # preparation. The replay's product HTTP guard starts inside its test bundles.
      - name: Prepare replay dependencies and localization
        run: |
          (cd packages/dsh_client && PUB_HOSTED_URL=https://pub.flutter-io.cn dart pub get --enforce-lockfile)
          (cd app && flutter pub get --enforce-lockfile && python3 tool/l10n_merge.py --no-gen && flutter gen-l10n)
      - name: Read actual engine evidence from this run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion-engine-replay
          path: ${{ runner.temp }}/companion-engine
      - name: Replay fifteen fixtures without a model service
        run: >-
          python3 tooling/companion/replay-memory.py
          --engine-report "$RUNNER_TEMP/companion-engine/companion-engine.xml"
          --output "$RUNNER_TEMP/companion-memory-replay"
      - name: Keep replay results and raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-memory-replay
          path: ${{ runner.temp }}/companion-memory-replay
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android JVM
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_MAVEN_MIRRORS: 0 # The Aliyun mirrors are slow and unreliable from a US runner.
    steps:
      - *checkout
      - &java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - *flutter
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      # gradlew is not tracked, so Gradle comes from here. The two flavors differ only in ABI.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      # Without the Flutter build task: it compiles the Dart side for the APK, close to a
      # minute, and the JVM tests read none of it.
      - working-directory: app/android
        run: gradle --stacktrace :app:testArm64DebugUnitTest -x :app:compileFlutterBuildArm64Debug

  # Two minutes that need kotlinc and a JVM but nothing of Flutter or Gradle: on a runner of
  # its own they come off the Android job, the longest one left.
  startup-policy:
    name: Android startup policy
    needs: changes
    if: needs.changes.outputs.startup_policy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *java
      - name: Runtime process cleanup and startup policy
        run: python3 runtime/tests/direct/startup-policy.py --output "$RUNNER_TEMP/startup-policy"

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, checks, analyze, flutter, dart, runtime, memory-replay, android, startup-policy, ios-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: >-
          needs.changes.result != 'success' || contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.memory == 'true' && needs.memory-replay.result != 'success') ||
          (github.event_name == 'pull_request' && needs.changes.outputs.ios_runtime == 'true' && needs.ios-runtime.result != 'success')
        run: exit 1
