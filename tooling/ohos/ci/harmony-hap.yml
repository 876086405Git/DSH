# Install as .github/workflows/harmony-hap.yml in the private build repository.
name: Build unsigned dsh-Go HarmonyOS HAP

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA from ccch1mneyyy/dsh-Go
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept only a commit already on dsh-Go main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be a full lowercase commit SHA' >&2
            exit 1
          fi
          comparison="$(curl -fsSL "https://api.github.com/repos/ccch1mneyyy/dsh-Go/compare/$SOURCE_SHA...main?per_page=1")"
          if ! jq -e --arg sha "$SOURCE_SHA" '.base_commit.sha == $sha and .merge_base_commit.sha == $sha' <<< "$comparison" >/dev/null; then
            echo 'source_sha must already be on ccch1mneyyy/dsh-Go main' >&2
            exit 1
          fi

  compile:
    needs: verify-source
    uses: ccch1mneyyy/dsh-Go/.github/workflows/ohos-compile.yml@main
    with:
      source_sha: ${{ inputs.source_sha }}

  package:
    needs: compile
    runs-on: [self-hosted, harmony, dsh-go-ohos-build]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ccch1mneyyy/dsh-Go
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Read the runtime's pinned Node version
        id: runtime
        run: |
          python3 -I -c 'import json; print("node=" + json.load(open("runtime/ohos/package/composition.json"))["nodeVersion"])' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ohos-aot-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/dsh-go-aot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compose the runtime and build the unsigned sideload HAP
        id: build
        env:
          AOT_PATH: ${{ runner.temp }}/dsh-go-aot-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          hap="$RUNNER_TEMP/dsh-go-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-unsigned.hap"
          bash tooling/ohos/ci/package-hap.sh "$AOT_PATH" "$hap"
          echo "hap=$hap" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-ohos-${{ inputs.source_sha }}-unsigned-hap
          path: ${{ steps.build.outputs.hap }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
